name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail the deploy rather than shipping a broken build.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      # Pages has to be switched on once, out of band, before this will pass:
      #
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      #
      # `enablement: true` looks like it would do that automatically, but the
      # default GITHUB_TOKEN cannot create a Pages site even with pages:write
      # — it fails with "Resource not accessible by integration". The repo
      # must also be public, or on a plan that allows Pages on private repos.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
